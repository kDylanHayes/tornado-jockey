name: Progress

# Publishes the progress page from the report committed in progress/.
# The report itself needs the game exe and the compiler, which can't be on
# GitHub's runners, so it is generated locally with tools/report.py and
# recorded with tools/progress.py --record progress (see docs/progress.md).

on:
  push:
    branches: [main]
    paths:
      - progress/**
      - tools/progress.py
      - .github/workflows/progress.yml
  pull_request:
    paths:
      - progress/**
      - tools/progress.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Summarize
        run: python3 tools/progress.py progress/report.json --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Build the progress page
        run: python3 tools/progress.py progress/report.json --site build/site --history progress/history.json

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/site

  deploy:
    needs: page
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
